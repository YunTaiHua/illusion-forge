appId: com.illusionforge.desktop
productName: IllusionForge
executableName: IllusionForge
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  useZip: true
  differentialPackage: false
  shortcutName: IllusionForge
  createDesktopShortcut: true

publish:
  provider: github
  owner: YunTaiHua
  repo: illusion-forge
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true

extraResources:
  - from: resources/
    to: .

win:
  target: nsis
  icon: build/icon.ico
  # 显式设置无空格 artifactName（空格会导致三处命名分裂）：
  #   - electron-builder 本地产物 / GitHub 上传资产名含空格时被转成点号
  #   - latest.yml 的 URL 是 electron-builder 生成的"安全名"（连字符）
  #   - electron-updater 按 latest.yml 下载 → 404 → 更新失败
  # 统一为连字符命名，保证本地产物名 = GitHub 资产名 = latest.yml URL。
  artifactName: IllusionForge-Setup-${version}.${ext}
